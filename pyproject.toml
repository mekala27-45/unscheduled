[project]
name = "unscheduled"
version = "0.1.0"
description = "Triage for the CVEs the NVD no longer analyzes: every change dated, the backlog measured, the exposure found twice, served live"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala" }]
dependencies = [
  "unscheduled-core",
  "unscheduled-render",
  "unscheduled-api",
  "unscheduled-match",
  "unscheduled-legacy-adapter",
  "unscheduled-sources",
  "typer>=0.15",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
unscheduled-core = { workspace = true }
unscheduled-render = { workspace = true }
unscheduled-api = { workspace = true }
unscheduled-match = { workspace = true }
unscheduled-legacy-adapter = { workspace = true }
unscheduled-sources = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "dbt", "notebooks", "data", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "scripts"]
explicit_package_bases = true
mypy_path = ["packages/core/src", "packages/render/src", "packages/api/src", "packages/sources/src", "packages/match/src", "packages/legacy_adapter/src"]
exclude = ["/tests/", "web/", "dbt/"]

[[tool.mypy.overrides]]
module = ["yaml", "markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["packages"]
branch = true
