# Alembic for the Neon slice. The connection comes from the environment (DATABASE_URL_UNPOOLED,
# then DATABASE_URL, then POSTGRES_URL) or from the caller; nothing is written here.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
