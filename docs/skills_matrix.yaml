# The README skills matrix (section 18 of the Phase 1 prompt). One row per skill an AI, machine
# learning, forward deployed or data science posting lists, and the paths that demonstrate it. The
# README shows a row only when every one of its paths is committed, so it lists only what is built;
# docs/ROADMAP.md holds the plan for the rest.
rows:
  - skill: Python and the data stack
    paths: [packages/sources, packages/lake]
    note: polars, DuckDB and pyarrow
  - skill: SQL and analytics engineering
    paths: [dbt/models, dbt/macros]
    note: staging, intermediate and marts, and the as-of macro
  - skill: Data quality
    paths: [dbt/tests]
    note: contracts on every mart and the named quarantine rules
  - skill: Point in time correctness
    paths: [packages/lake, tests/lake]
    note: the as-of engine, its parity test and the planted future fact
  - skill: Statistics
    paths: [packages/analysis]
    note: cluster bootstrap, Cohen and weighted kappa, Benjamini-Hochberg, the domain classifier
  - skill: APIs
    paths: [packages/api, openapi.json]
    note: FastAPI over Neon, typed problem documents, the committed schema
  - skill: API integration
    paths: [packages/sources]
    note: NVD, CVE List, KEV, EPSS, OSV, GitHub advisories, GLEIF and EDGAR
  - skill: Supply chain security
    paths: [packages/match, customer/sboms]
    note: the matcher in code, checked by osv-scanner, with Grype as the CPE contrast
  - skill: Legacy code
    paths: [customer/legacy, tests/characterization, packages/legacy_adapter]
    note: characterization tests first, then a strangler with a byte for byte contract
  - skill: CLI
    paths: [packages/cli]
    note: the same services as the API
  - skill: Modular design and trade offs
    paths: [packages, docs/adr]
    note: one package per concern and a record for every decision
  - skill: Coding agents
    paths: [AGENTS.md, CLAUDE.md, .claude/skills]
    note: one source of rules and four skills in the Agent Skills format
  - skill: CI and DevOps
    paths: [.github/workflows, Dockerfile.vercel]
    note: the gates, gitleaks, zizmor, actions pinned by commit, Vercel deploys
  - skill: Frontend and design systems
    paths: [web, web/styles/tokens.css, tools/hallmark]
    note: tokens first, shadcn/ui themed through them, the palette validator
  - skill: Accessibility and performance
    paths: [.github/workflows/web.yml]
    note: axe and Lighthouse in CI
  - skill: Forward deployed discovery
    paths: [report/discovery.md, config/criteria.yaml]
    note: the discovery memo and the criteria the customer signed
  - skill: Communication
    paths: [report/backlog.md]
    note: the backlog report and the pushback paragraph on every evidence page
  - skill: Technical writing
    paths: [docs, docs/diagrams, CHANGELOG.md]
    note: a quickstart, the API reference from the schema, method notes, and archify diagrams that cite the lines they draw
  # Phase 2 (section 18 of its prompt): only what this phase built. PyTorch is left out, since
  # ModernBERT did not run; its row comes with the first GPU run.
  - skill: Classical machine learning
    paths: [packages/models/src/unscheduled_models/floors.py, packages/models/src/unscheduled_models/rank.py]
    note: a TF-IDF floor for every model, and LightGBM tuned by Optuna on time ordered folds
  - skill: Calibration, conformal sets and survival
    paths: [packages/models/src/unscheduled_models/calibrate.py, packages/models/src/unscheduled_models/conformal.py, packages/models/src/unscheduled_models/survival.py, packages/models/src/unscheduled_models/reweight.py]
    note: temperature and isotonic scaling, split conformal sets, Cox and a survival forest, and the shadow window weighted with its effective sample size
  - skill: NLP
    paths: [packages/models/src/unscheduled_models/embed.py, packages/models/src/unscheduled_models/product.py]
    note: frozen sentence embeddings through onnxruntime, and retrieval over the CPE dictionary
  - skill: Evals and error analysis
    paths: [results/models, notebooks/04_the_random_split.ipynb, notebooks/05_reading_the_misses.ipynb, notebooks/06_epss_on_day_30.ipynb]
    note: floors first, paired intervals, and a hundred development misses read and coded
  - skill: MLOps
    paths: [packages/models/src/unscheduled_models/registry.py, packages/models/src/unscheduled_models/export.py, requests/gpu]
    note: an MLflow registry built from the run records, ONNX models checked for parity, and a GPU budget kept as committed requests
  - skill: R
    paths: [R/check_cox.R]
    note: the Cox model refit with survival::coxph and compared within a declared tolerance
