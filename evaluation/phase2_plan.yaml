# The Phase 2 plan: every model, its features, its label, its population, how it is chosen and how
# it is judged. Hashed into evaluation/registration.json as the models stage before any model sees
# a test CVE. A change after the hash is a change request in DECISIONS.md that keeps both results.
registered_for: Phase 2, the models
scoring_time: day 0, the end of the publication day in UTC
windows:
  fit: train
  choose: development
  judge: test, scored once by scripts/score_test.py
  predict: shadow and the serving slice
  excluded: gap, used by no model
defaults:
  seed: 20261114
  interval: bootstrap, 2000 resamples, 95 percent
  family_correction: Benjamini-Hochberg at 0.05
  hash_seeds: [0, 1]
features:
  rule: >-
    Every feature is the value known at day 0, read from silver.cve_fact or the bronze it came from
    with known_from at or before day 0. A feature column empty for a whole window fails the build.
  description: >-
    The text the NVD change history holds at day 0: the Description added by New CVE Received and
    changed by later events up to day 0. For a CVE published before the history begins, or with no
    Description event by day 0, the current text, and the row records description_rule current.
  text: >-
    One joined field for every text model, written by one function: the day 0 description, the
    filer short name, and the affected vendor and product strings.
  filer:
    - short name
    - filer type, by the Phase 1 typing of every assigner
    - the filer CWE set at day 0
    - the filer CVSS 3.1 vector and its eight base metrics
    - the filer CVSS 3.0 vector
    - the filer CVSS 4.0 vector
    - the filer band, CVSS 3.1 else 3.0
  cisa_adp:
    - CVSS 3.1 vector and band, only when known at day 0
    - CWE set, only when known at day 0
    - SSVC exploitation, automatable and technical impact, only when known at day 0
  affected:
    - vendor and product present
    - versions present
    - count of affected entries
  signals:
    - exploit code seen by day 0 (Metasploit or Nuclei)
    - days from reserved to published
  time:
    - published year and month as numbers, never as a split key
  never:
    - EPSS at any offset
    - any NVD value
    - KEV
    - anything known after day 0
labels:
  band: >-
    The NVD CVSS 3.1 severity (LOW, MEDIUM, HIGH, CRITICAL) as known at the lake cut. NONE is
    counted and left out.
  metrics: The eight NVD CVSS 3.1 base metrics (AV, AC, PR, UI, S, C, I, A) at the cut.
  cwe: >-
    The NVD CWE set at the cut. The 50 most frequent in train are classes and every other value is
    other; a CVE with several takes the one most frequent in train.
  kev_180: >-
    A KEV dateAdded within 180 days of publication. A listing before publication stays in
    quarantine Q03, and its CVE leaves the exploitation population.
  days_to_kev: Days from publication to the KEV dateAdded, censored at the lake cut.
populations:
  fill: published CVEs with the label, rejected excluded, per window
  rank: every published CVE in the window, rejected and Q03 excluded
  c1: test window CVEs with an NVD CVSS 3.1 band (config/criteria.yaml, C1)
  c2: test window CVEs (config/criteria.yaml, C2)
models:
  band_floor:
    kind: TF-IDF and logistic regression
    text: word 1 and 2 grams, min_df 3, at most 200000 features, sublinear term frequency
    with: the filer and CISA features, one hot
    choose: >-
      C from 0.1, 0.3, 1, 3, 10, and word grams against word plus character 3 to 5 grams, by
      quadratic weighted kappa on development
  metrics_floor:
    kind: as band_floor, one per base metric
    choose: C per metric by Cohen kappa on development
  cwe_floor:
    kind: as band_floor
    choose: C by macro F1 on development
  modernbert:
    weights: config/models.yaml, modernbert
    heads: the band, the eight base metrics, the CWE
    input: the joined text, at most 256 tokens
    epochs: 3, with early stopping on the development band kappa
    learning_rate: 5e-5, 6 percent warmup, linear decay
    batch: 32
    precision: mixed
    seed: the default seed
    gpu_hours_declared: 3
  fallback_text:
    used_when: the Kaggle secrets are absent at step 8
    kind: frozen embeddings from config/models.yaml embedding, a logistic head per task
    choose: C per task on development, by the metric of its floor
  band_from_metrics:
    kind: the CVSS 3.1 base score computed from the predicted metrics with the cvss library, banded
    role: reported beside the band head, never the primary
  exploit_floor:
    kind: logistic regression
    features: the day 0 features and the band floor text projection
    class_weight: balanced
    choose: C by average precision on development
  exploit_lgbm:
    kind: LightGBM
    features: as exploit_floor
    search: Optuna TPE, 50 trials
    folds: fit on the years up to Y and validate on Y plus 1, for Y from 2018 to 2022
    objective: mean average precision over the folds
    space:
      num_leaves: [15, 255]
      learning_rate: [0.01, 0.2, log]
      min_child_samples: [10, 200]
      feature_fraction: [0.5, 1.0]
      bagging_fraction: [0.5, 1.0]
      lambda_l2: [0.001, 10, log]
      n_estimators: early stopping on each fold, at most 2000
  survival_cox:
    kind: lifelines CoxPHFitter
    features: the day 0 features without the text
    choose: penalizer from 0.01, 0.1, 1 by concordance on development
  survival_rsf:
    kind: scikit-survival RandomSurvivalForest, 300 trees
    choose: min_samples_leaf from 10, 30, 100 by concordance on development
  survival_r_check:
    kind: R survival::coxph on the exported design matrix, unpenalized
    tolerance: coefficients within 0.001 absolute and concordance within 0.002 of lifelines unpenalized
  product_floor:
    kind: >-
      vendor and product strings normalized (lower case, punctuation to spaces, common company
      suffixes dropped), an exact match to the CPE dictionary, then a token set ratio
    choose: the ratio threshold by recall at 1 on development
  product_retrieval:
    kind: embeddings from config/models.yaml embedding, cosine over every CPE vendor and product name
    returns: the top 10
calibration:
  fill: temperature scaling per head, fit on development by negative log likelihood
  exploit: isotonic regression on development
  ece: 15 equal width bins on the top label probability, with a bootstrap interval
conformal:
  method: split conformal with adaptive prediction sets (MAPIE), calibrated on development
  target_coverage: 0.90
  report: empirical coverage and mean set size on test, overall and by filer type
reweighting:
  weights: >-
    The Q8 domain classifier odds that a shadow CVE is one the NVD skipped, applied to the shadow
    CVEs the NVD analyzed.
  clip: 20
  effective_sample_size: Kish
  report: plain and weighted, side by side, never one without the other
evaluation:
  c1: >-
    As config/criteria.yaml C1, unchanged; the paired difference with band_floor by the same cluster
    bootstrap by filer.
  c2: >-
    As config/criteria.yaml C2, unchanged; EPSS at days 1, 7 and 30 from the Phase 1 offsets with
    paired bootstrap differences; an interval that holds zero is a tie.
  secondary:
    - kappa per base metric
    - CWE top 1 and top 5 accuracy, and macro F1
    - exploitation average precision, AUROC and Brier score
    - survival concordance
    - product recall at 1, 5 and 10
  slices:
    families:
      - filer, the twenty largest in test
      - filer type
      - CWE, the twenty largest
      - vendor, the twenty largest
      - published year
    metric: band kappa for the fill models, average precision for the rank models
    correction: Benjamini-Hochberg at 0.05 within each family
  failure_taxonomy: >-
    100 band misses drawn with the default seed from development, coded by reading into categories
    named while reading, with counts in the manifest. Never from test.
test_scoring:
  script: scripts/score_test.py
  requires: config/operating_points.yaml hashed into the registration before the run
  runs: >-
    Once. A second run on different model digests needs a DECISIONS.md change request that keeps
    both results.
predictions:
  serving: >-
    Every CVE in the serving slice (published since 2021, and every KEV listed CVE), measured
    against the Neon ceiling before loading.
  shadow: >-
    Every shadow CVE, with the distribution of predicted bands against filer bands, and no accuracy
    claim where no label exists.
gpu:
  ceiling: config/budgets.yaml, kaggle_gpu_hours_month
  rule: every run declares its hours and the hours left in a committed file under requests/gpu/
predictions_made_before_results:
  - The band floor reaches a test kappa near the Phase 1 filer against NVD agreement, and the text model beats it by a few points.
  - Calibration error is small on development and larger on test, because the vendor mix moves.
  - Conformal coverage on test falls a little short of 90 percent for the same reason.
  - The exploitation model holds more KEV listings in its top 5 percent than EPSS at day 1, and the gap to EPSS at day 30 is a tie or a loss.
  - The reweighted band kappa is lower than the plain one.
