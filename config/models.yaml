# The models of Phase 2: the libraries they need and the weights they start from.
# The probe reads this file (scripts/probe_hosts.py, section phase2). A weight is pinned to the
# revision the probe resolved on the day it was read; moving a pin is a DECISIONS.md entry.
# The GPU ceiling for the month lives in config/budgets.yaml, not here.
libraries:
  - torch
  - transformers
  - sentence-transformers
  - optimum
  - onnx
  - onnxruntime
  - skl2onnx
  - onnxmltools
  - lightgbm
  - optuna
  - lifelines
  - scikit-survival
  - mapie
  - mlflow
  - faiss-cpu
  - kaggle
weights:
  modernbert:
    id: answerdotai/ModernBERT-base
    use: the multi-task fill model, fine tuned on a Kaggle GPU (step 8)
    licence: apache-2.0
    revision: 8949b909ec900327062f0ebf497f51aef5e6f0c8
    pinned_on: 2026-11-14
  embedding:
    id: BAAI/bge-small-en-v1.5
    use: the affected product retrieval (step 5) and the CPU fallback for step 8
    licence: mit
    revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
    pinned_on: 2026-11-14
