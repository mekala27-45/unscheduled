# The stand in products of the fictional customer in config/customer.yaml.
# Public open source repositories, and one public image, stand in for its six products; none of
# them is the customer's code and every page that shows one names it as a stand in.
# The rule below is fixed. `uv run python scripts/make_sboms.py select` applies it and rewrites
# this file with stand_ins as read on the day, each with the repositories passed over and why.
# Edit the rule, never the picks.
rule:
  cutoff: '2025-01-01T00:00:00Z'
  min_stars: 1000
  statement: 'One public repository per ecosystem (npm, PyPI, Go, Maven or Gradle, crates.io) and one
    public container image for the firmware Linux layer. A repository qualifies when it was created before
    the cutoff, is not a fork and is not archived, has at least the minimum stars, carries a licence GitHub
    detects whose SPDX id the SPDX licence list marks OSI approved, has a commit on its default branch
    committed before the cutoff, and has a lockfile of its ecosystem at the root at that commit (for Maven
    a root pom.xml counts, and the build then declares that only declared dependencies are seen). The
    licence file at the pinned commit must be the licence file of today, so the licence GitHub detects
    today held at the pin. It is pinned to its newest commit before the cutoff, so that known vulnerabilities
    exist today. Of the qualifying repositories in the ecosystem''s languages the most starred is chosen,
    ties broken by name. The image is the Docker Official Image of Debian, the distribution whose advisories
    the sources fetch from OSV, in its slim variant: the last dated tag before the cutoff, pinned by the
    digest of its linux/arm64 manifest, the platform the door controllers run on.'
ecosystems:
- product: cloud-dashboard
  ecosystem: npm
  languages:
  - JavaScript
  - TypeScript
  lockfiles:
  - package-lock.json
  - npm-shrinkwrap.json
  - yarn.lock
  - pnpm-lock.yaml
  manifests:
  - package.json
- product: python-data-jobs
  ecosystem: PyPI
  languages:
  - Python
  lockfiles:
  - poetry.lock
  - uv.lock
  - Pipfile.lock
  - pdm.lock
  manifests:
  - pyproject.toml
  - Pipfile
- product: go-edge-service
  ecosystem: Go
  languages:
  - Go
  lockfiles:
  - go.sum
  manifests:
  - go.mod
- product: java-integration-service
  ecosystem: Maven
  languages:
  - Java
  lockfiles:
  - gradle.lockfile
  - pom.xml
  manifests: []
- product: rust-cli
  ecosystem: crates.io
  languages:
  - Rust
  lockfiles:
  - Cargo.lock
  manifests:
  - Cargo.toml
image:
  product: door-controller-firmware
  ecosystem: Debian
  registry: docker.io
  repository: library/debian
  tag_prefix: bookworm-
  tag_pattern: ^bookworm-(?P<date>\d{8})-slim$
  platform: linux/arm64
  mirrors:
  - mirror.gcr.io/library/debian
osi_list:
  source: https://raw.githubusercontent.com/spdx/license-list-data/main/json/licenses.json
  version: 8791eda
  read_at: '2026-11-08T03:46:20Z'
