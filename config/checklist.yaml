# Section 20 of the Phase 1 prompt. Each line is done only when its evidence exists, so the
# checklist asks whether a step ran, not whether its output looks right. Evidence is a file a step
# or a check wrote, never an input that merely exists.
items:
  - n: 1
    text: "The setup done by the build with no typed secret; the probes ran first"
    evidence:
      - results/probe.json
      - results/probe_platform.json
      - results/setup.json
  - n: 2
    text: "Every source fetched and locked by digest with licences and terms recorded"
    evidence:
      - results/lake/locks.json
      - data/PROVENANCE.md
  - n: 3
    text: "Every change to every CVE dated; the as-of engine passes parity and the planted future fact test"
    evidence:
      - results/lake/asof_tests.json
  - n: 4
    text: "dbt contracts and tests pass; quarantine counts in the manifest; status vocabulary registered"
    evidence:
      - results/lake/dbt_results.json
      - config/labels.yaml
  - n: 5
    text: "The month criteria and the Phase 1 plan hashed before any test CVE was scored"
    evidence:
      - evaluation/registration.json
  - n: 6
    text: "Q1 to Q8 answered with intervals and every chart with its table and SQL"
    evidence:
      - results/backlog/q1.json
      - results/backlog/q8.json
  - n: 7
    text: "The customer name checked; six stand ins pinned by rule; SBOMs committed"
    evidence:
      - results/name_check.json
      - config/products.yaml
  - n: 8
    text: "The matcher and osv-scanner agree; the CPE contrast measured"
    evidence:
      - results/exposure/disagreements.json
      - results/exposure/summary.json
  - n: 9
    text: "The legacy script characterized and replaced by the adapter"
    evidence:
      - report/legacy.md
  - n: 10
    text: "The API live on Vercel with Neon, loaded only by the sync, verified from a separate client"
    evidence:
      - results/live/api_verify.json
  - n: 11
    text: "Persistence observed independently; schemathesis green; the load test with the cold start"
    evidence:
      - results/load/c8.json
  - n: 12
    text: "The CLI gives the same answers as the API on the same inputs"
    evidence:
      - results/cli_parity.json
  - n: 13
    text: "The design system in place with the palette validator green in CI"
    evidence:
      - web/styles/tokens.css
      - results/design/palette.json
  - n: 14
    text: "The console, the ruler, the landing, the docs and the report live on Vercel"
    evidence:
      - results/live/web_verify.json
  - n: 15
    text: "sloplint, axe and Lighthouse green; the look reviewed or marked pending"
    evidence:
      - results/design/gates.json
  - n: 16
    text: "README with the matrix, RESULTS, DECISIONS, the memos and notebooks; the humanizer pass"
    evidence:
      - RESULTS.md
      - report/discovery.md
      - report/backlog.md
      - report/legacy.md
      - notebooks/01_the_first_backlog_chart.ipynb
      - notebooks/02_kappa_on_everything.ipynb
      - notebooks/03_the_matcher_without_schemes.ipynb
      - results/humanizer.json
  - n: 17
    text: "The live check awake and asleep; reset and rederive reproduced every number"
    evidence:
      - results/live_check.json
      - results/rederive.json
  - n: 18
    text: "At least fifty conventional commits; v0.1.0 tagged; BUILD_STATE.md written for Phase 2"
    evidence:
      - results/release.json

# Section 20 of the Phase 2 prompt, printed in RESULTS.md beside the first. A file an earlier phase
# wrote counts for this phase only with what this phase writes into it (has, equals).
phase2:
  - n: 1
    text: "The probes extended and read by every model step; the scoped model gate in CI with its three tests"
    evidence:
      - {file: results/probe.json, has: [[phase2, libraries], [phase2, weights]]}
  - n: 2
    text: "The Phase 2 plan hashed as registration stage two before any model saw a test CVE"
    evidence:
      - {file: evaluation/registration.json, equals: {stages/2/stage: models}}
  - n: 3
    text: "The training sets built point in time, the leakage test passing, the sets published by digest"
    evidence:
      - results/models/sets.json
  - n: 4
    text: "Every model has a floor trained on the same rows; every comparison has a paired interval"
    evidence:
      - results/models/floors.json
      - results/models/c1.json
      - results/models/c2.json
  - n: 5
    text: "The affected product retrieval measured against the NVD CPE configurations"
    evidence:
      - results/models/product.json
  - n: 6
    text: "The exploitation model tuned on time ordered folds; the survival model checked in R"
    evidence:
      - results/models/rank.json
      - {file: results/models/survival.json, equals: {r_check/result: pass}}
  - n: 7
    text: "ModernBERT run on Kaggle by a committed request inside the GPU budget, or its fallback named; ONNX parity passing"
    evidence:
      - results/parts/gpu.json
      - results/models/fallback.json
      - {file: results/models/onnx.json, equals: {verdict: pass}}
  - n: 8
    text: "Calibration and conformal sets fit on development, with coverage on test"
    evidence:
      - results/models/calibration.json
      - results/models/conformal.json
      - {file: results/models/test_scoring.json, has: [[secondary, conformal, band]]}
  - n: 9
    text: "The plain and reweighted views reported with the effective sample size"
    evidence:
      - results/models/reweighting.json
  - n: 10
    text: "MLflow runs and the registry; the model cards rendered from the manifest"
    evidence:
      - results/registry/registry.json
      - report/models.md
      - report/models/band.md
  - n: 11
    text: "Test scored once by scripts/score_test.py; C1 and C2 evidence with their verdicts"
    evidence:
      - {file: results/models/c1.json, has: [[verdict]]}
      - {file: results/models/c2.json, has: [[verdict]]}
  - n: 12
    text: "EPSS beside every exploitation number; ties named"
    evidence:
      - {file: results/models/c2.json, has: [[recall_at_top5, epss_day_1], [recall_at_top5, epss_day_7], [recall_at_top5, epss_day_30]]}
  - n: 13
    text: "Slices with Benjamini-Hochberg; the failure taxonomy in the manifest"
    evidence:
      - {file: results/models/test_scoring.json, has: [[slices, fill], [slices, exploitation]]}
      - results/parts/taxonomy.json
  - n: 14
    text: "The predictions in the serving bundle and the API; /v1/predict live; Neon under its ceiling"
    evidence:
      - results/models/predictions.json
      - {file: results/live/api_verify.json, has: [[predictions]]}
  - n: 15
    text: "The console shows every prediction with its model, version and uncertainty; design gates green; the look reviewed by Ajay"
    evidence:
      - results/design/gates.json
      - results/design/look_review.json
  - n: 16
    text: "The docs, ADRs 0008 to 0010, report/models.md and notebooks 04 to 06; the humanizer pass done"
    evidence:
      - docs/models.md
      - docs/adr/0008-predictions-from-a-batch.md
      - docs/adr/0009-the-gpu-as-a-committed-request.md
      - docs/adr/0010-the-fill-model-earns-its-place.md
      - report/models.md
      - notebooks/04_the_random_split.ipynb
      - notebooks/05_reading_the_misses.ipynb
      - notebooks/06_epss_on_day_30.ipynb
      - {file: results/humanizer.json, has: [[phase2]]}
  - n: 17
    text: "The live check awake and asleep; reset and rederive reproduced every CPU model number"
    evidence:
      - {file: results/live_check.json, has: [[awake, predict], [asleep, predict]]}
      - {file: results/rederive.json, has: [[parts, rank.json], [parts, survival.json], [test_recheck]]}
  - n: 18
    text: "At least fifty conventional commits; the release record passing; v0.2.0 pushed by Ajay; BUILD_STATE.md written for Phase 3"
    evidence:
      - {file: results/release.json, equals: {tag: v0.2.0}}
