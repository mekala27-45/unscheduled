# Section 20 of the Phase 1 prompt. Each line is done only when its evidence exists, so the
# checklist asks whether a step ran, not whether its output looks right. Evidence is a file a step
# or a check wrote, never an input that merely exists.
items:
  - n: 1
    text: "The setup done by the build with no typed secret; the probes ran first"
    evidence:
      - results/probe.json
      - results/probe_platform.json
      - results/setup.json
  - n: 2
    text: "Every source fetched and locked by digest with licences and terms recorded"
    evidence:
      - results/lake/locks.json
      - data/PROVENANCE.md
