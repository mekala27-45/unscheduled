name: models

# The Phase 2 fits too large for a laptop, run on demand from the committed sets and nothing else.
# The lake release results/lake/release.json names is restored with every archive checked against
# the digests that record kept; the lake is rebuilt; the sets are rebuilt and must match the content
# digests in results/models/sets.json before anything is fit. The outputs go up as an artifact, and
# the records under results/ are committed from it. No job writes to the repository or a release.
on:
  workflow_dispatch:
    inputs:
      step:
        description: The Phase 2 step to run
        type: choice
        options:
          - floors
          - exploitation
          - survival
          - fallback
          - product
        default: floors
      cpe_release:
        description: The lake release whose bronze carries the CPE dictionary (the product step only)
        type: string
        required: false
        default: ""
      embeddings_run:
        description: >-
          A models run whose fallback artifact holds the text embeddings, read again by the fallback
          and product steps where their rows match (empty to embed every row)
        type: string
        required: false
        default: ""
      floors_run:
        description: >-
          The models run of the floors step, whose artifact holds the band floor the exploitation
          step projects with, the one the API serves (the exploitation step only)
        type: string
        required: false
        default: ""

permissions: {}

# One run per step at a time; different steps run side by side on their own runners.
concurrency:
  group: models-${{ inputs.step }}
  cancel-in-progress: false

jobs:
  fit:
    name: fit from the committed sets
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      # To download the artifact of an earlier run when embeddings_run or floors_run names one.
      actions: read
    env:
      PYTHONHASHSEED: "0"
      GH_TOKEN: ${{ github.token }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen

      - name: The recorded lake release, every archive unchanged
        run: uv run python scripts/restore_release.py --recorded

      - name: The lake, beside the content digest committed for it
        run: |
          uv run python scripts/build_lake.py --memory 10GB --threads 4
          committed="$(git show HEAD:results/lake/lake.json | jq -r .content_digest)"
          built="$(jq -r .content_digest results/lake/lake.json)"
          if [ "$committed" = "$built" ]; then
            echo "The lake content digest matches the committed one: $built"
          else
            echo "::warning::The lake content digest $built differs from the committed $committed; the sets check below decides"
          fi

      - name: The sets, which must match results/models/sets.json
        run: uv run python scripts/build_sets.py --check

      - name: The fill floors
        if: env.STEP == 'floors'
        run: uv run python scripts/train_floors.py --jobs 4 --heavy 2

      - name: The committed band floor, from the floors run that made it
        if: env.STEP == 'exploitation'
        env:
          FLOORS_RUN: ${{ inputs.floors_run }}
          REPO: ${{ github.repository }}
        run: |
          case "$FLOORS_RUN" in
            ""|*[!0-9]*) echo "::error::the exploitation step needs floors_run, the run id of the floors step"; exit 1 ;;
          esac
          gh run download "$FLOORS_RUN" --repo "$REPO" --name floors --dir reuse-floors
          mkdir -p data/models/floors
          cp reuse-floors/data/models/floors/floors.joblib data/models/floors/
          rm -rf reuse-floors
          # scripts/train_rank.py checks the file against the SHA-256 results/models/floors.json names.
          ls -l data/models/floors

      - name: The exploitation models, on the committed band floor
        if: env.STEP == 'exploitation'
        run: uv run python scripts/train_rank.py --jobs 4

      - name: R with the survival package, for the Cox check
        if: env.STEP == 'survival'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - name: The survival models, checked in R
        if: env.STEP == 'survival'
        run: |
          Rscript -e 'if (!requireNamespace("survival", quietly = TRUE)) install.packages("survival", repos = "https://cloud.r-project.org")'
          uv run python scripts/train_survival.py --jobs 4 --r-check

      - name: The text embeddings of an earlier fallback run, when one is named
        if: inputs.embeddings_run != '' && (env.STEP == 'fallback' || env.STEP == 'product')
        env:
          EMBEDDINGS_RUN: ${{ inputs.embeddings_run }}
          REPO: ${{ github.repository }}
        run: |
          case "$EMBEDDINGS_RUN" in
            *[!0-9]*) echo "::error::embeddings_run must be a run id"; exit 1 ;;
          esac
          gh run download "$EMBEDDINGS_RUN" --repo "$REPO" --name fallback --dir reuse
          mkdir -p data/models/fallback
          cp reuse/data/models/fallback/*_embeddings.npz data/models/fallback/
          rm -rf reuse
          # The scripts check each file's CVE ids against the rows they embed and embed again on a
          # mismatch, so a stale file is never read.
          ls -l data/models/fallback

      - name: The ModernBERT fallback, frozen embeddings with a head per task
        if: env.STEP == 'fallback'
        run: uv run python scripts/train_fallback.py --jobs 4

      - name: The CPE dictionary from the lake release that carries it
        if: env.STEP == 'product'
        env:
          CPE_RELEASE: ${{ inputs.cpe_release }}
        run: |
          if [ -z "$CPE_RELEASE" ]; then
            echo "::error::the product step needs cpe_release, a lake release with bronze-cpe_names.tar"
            exit 1
          fi
          uv run python scripts/restore_release.py --release "$CPE_RELEASE" --table cpe_names

      - name: The affected product models
        if: env.STEP == 'product'
        run: |
          args=(--jobs 4)
          if compgen -G "data/models/fallback/*_embeddings.npz" > /dev/null; then
            args+=(--embeddings data/models/fallback)
          fi
          uv run python scripts/train_product.py "${args[@]}"

      - name: Gather what the step wrote
        if: always()
        run: |
          mkdir -p out
          case "$STEP" in
            floors) files="results/models/floors.json results/parts/floors.json data/models/floors" ;;
            exploitation) files="results/models/rank.json results/parts/rank.json data/models/rank" ;;
            survival) files="results/models/survival.json results/parts/survival.json data/models/survival" ;;
            fallback) files="results/models/fallback.json results/parts/fallback.json data/models/fallback" ;;
            product) files="results/models/product.json results/parts/product.json data/models/product" ;;
            *) files="" ;;
          esac
          for f in $files; do
            if [ -e "$f" ]; then cp -r --parents "$f" out/; fi
          done

      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.step }}
          path: out
          retention-days: 30
          if-no-files-found: warn
