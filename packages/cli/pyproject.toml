[project]
name = "unscheduled-cli"
version = "0.1.0"
description = "unsched, the command line over the same services as the API"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "unscheduled-api",
  "unscheduled-render",
  "typer>=0.28",
  "uvicorn>=0.54",
  "httpx>=0.28",
]

[project.scripts]
unsched = "unscheduled_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_cli"]
