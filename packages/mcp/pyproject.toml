[project]
name = "unscheduled-mcp"
version = "0.1.0"
description = "The MCP server of unscheduled: search, triage and runs as tools, over stdio and streamable HTTP, with no tool that approves, applies or files"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "pydantic>=2.10",
  # Pinned by the rule in config/agent.yaml: the newest release at least 14 days old on 16 November.
  "mcp==2.3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_mcp"]
