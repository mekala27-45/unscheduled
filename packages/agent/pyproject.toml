[project]
name = "unscheduled-agent"
version = "0.1.0"
description = "The triage agent: free models behind a router with a no model floor, the LangGraph graph with checkpoints in Postgres, and approval by a person"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# Pinned by the rule in config/agent.yaml: the newest release at least 14 days old on 16 November.
dependencies = [
  "unscheduled-core",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-core==1.7.4",
  "psycopg[binary]>=3.3",
  "pydantic>=2.10",
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_agent"]
