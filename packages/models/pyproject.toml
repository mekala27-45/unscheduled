[project]
name = "unscheduled-models"
version = "0.2.0"
description = "Phase 2: point in time training sets, the floors, the rank and survival models, calibration, conformal sets and the registry"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "unscheduled-lake",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=2.1",
  "pyarrow>=20.0",
  "duckdb==2.0.0",
  "pyyaml>=6.0",
  "scikit-learn==1.9.1",
  "scipy>=1.14",
  "joblib>=1.4",
  "lightgbm==4.7.0",
  "optuna==5.0.0",
  "lifelines==0.30.3",
  "scikit-survival==0.28.0",
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_models"]
