[project]
name = "unscheduled-api"
version = "0.1.0"
description = "The API: every CVE with its history, the backlog, the exposure and live SBOM matching"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "unscheduled-match",
  "unscheduled-legacy-adapter",
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "structlog>=26.1",
  "polars>=1.30",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "onnxruntime==1.32.0",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_api"]
