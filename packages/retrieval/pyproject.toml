[project]
name = "unscheduled-retrieval"
version = "0.1.0"
description = "The advisory corpus point in time, chunked by section, and retrieval measured against a lexical floor"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "tokenizers==0.23.3",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "duckdb==2.0.0",
  "polars>=2.1",
  "onnxruntime==1.32.0",
  "psycopg[binary]>=3.3",
  "pgvector==0.5.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_retrieval"]
