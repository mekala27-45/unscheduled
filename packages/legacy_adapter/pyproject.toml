[project]
name = "unscheduled-legacy-adapter"
version = "0.1.0"
description = "The strangler for the customer's 2019 report: the same CSV, byte for byte in its header and types, written from findings"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "unscheduled-match",
  "cvss==3.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_legacy_adapter"]
