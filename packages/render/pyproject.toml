[project]
name = "unscheduled-render"
version = "0.1.0"
description = "The claim gate renderer: documents rendered from the manifest"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "unscheduled-core",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscheduled_render"]
