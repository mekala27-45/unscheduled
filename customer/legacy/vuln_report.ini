# /opt/secops/vuln_report.ini, as handed over with vuln_report.py (a fixture: see its header).
[feeds]
base_url = https://nvd.nist.gov/feeds/json/cve/1.1/
include_modified = yes
# the yearly feeds; add the new year each January
years = 2018,2019

[filter]
vendors = openssl, busybox, linux, debian, apache, nodejs, golang, siemens

[output]
directory = /var/lib/secops/reports

